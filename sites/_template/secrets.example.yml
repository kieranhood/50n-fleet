# The shape of sites/<site>/secrets.sops.yml. Copy it there, fill it in, then encrypt it in place:
#   sops --encrypt --in-place sites/<site>/secrets.sops.yml
# Edit it later with: sops sites/<site>/secrets.sops.yml
# Leave out anything the site doesn't use.

# UniFi API key per portal client id (Network API key for "integration", Site Manager key for "connector")
unifi_api_keys:
  example-client: ""

# Legacy UniFi types (unifios / standalone) only: a local admin account per client
unifi_logins:
  example-client:
    username: ""
    password: ""

# Cloudflare Zero Trust › Networks › Tunnels › this site's tunnel: the token after --token
cloudflared_tunnel_token: ""

# A read-only GitHub token (read:packages) for pulling the portal image from ghcr.io
ghcr_username: kieranhood
ghcr_token: ""

# This site's Uptime Kuma push monitor URL, e.g. https://status.50northsystems.com/api/push/AbCdEf
heartbeat_url: ""

# Netdata Cloud: Space › Connect Nodes (only if netdata_enabled)
netdata_claim_token: ""
netdata_claim_rooms: ""

# PMS (only if pms_enabled). Set once at install; never changed on a live boat without the owner's approval.
pms_postgres_password: ""
# A read-only deploy key for kieranhood/PMS (GitHub › repo › Settings › Deploy keys), private part
pms_deploy_key: ""

# Only if fleet_pull_enabled: a read-only deploy key for kieranhood/50n-fleet, private part
fleet_deploy_key: ""
